<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="stylesheet" href="../src/components/styles.css"><link rel="stylesheet" href="../src/components/capabilities.css"><link rel="stylesheet" href="../src/components/travel.css"></head><body><div id="app"></div><script type="module">
import {SettingsView} from '../src/components/views.js';
import {mountTravel} from '../src/travel.js';
const settings=SettingsView();settings.hidden=false;document.getElementById('app').append(settings);
const wallet=document.createElement('div');wallet.hidden=true;document.body.append(wallet);
// Connected fixture: the Settings screen's one connection is the wallet's own.
// The synthetic token stays in this page so connect and disconnect can be tried.
let token='synthetic-preview-token-0123456789abcdef';
const credentials={get:async()=>token,set:async value=>{token=value;},remove:async()=>{token='';}};
mountTravel(wallet,{credentials,request:async()=>({records:[]}),connectionRoot:document.getElementById('travel-settings-connection')});
</script></body></html>
