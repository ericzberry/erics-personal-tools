<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Focus Mail</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <img src="../icons/icon-128.png" alt="" width="26" height="26">
    <h1>Focus Mail</h1>
    <input type="checkbox" role="switch" class="switch" id="enabled" aria-label="Hold new mail">
  </header>

  <section class="next" aria-live="polite">
    <p class="eyebrow" id="next-label"></p>
    <p class="when"><span id="next-time"></span><span id="next-period"></span><span id="next-in"></span></p>
    <div class="track" id="track" aria-hidden="true"><i></i></div>
    <button type="button" id="deliver" class="primary">Deliver now</button>
  </section>

  <section aria-labelledby="times-heading">
    <h2 id="times-heading">Delivery times</h2>
    <ul id="times" class="chips"></ul>
  </section>

  <script src="schedule.js"></script>
  <script src="popup.js"></script>
</body>
</html>
