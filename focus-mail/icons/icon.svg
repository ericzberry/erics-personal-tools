<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7c89ff"/>
      <stop offset=".55" stop-color="#4f44e0"/>
      <stop offset="1" stop-color="#2f2296"/>
    </linearGradient>
    <radialGradient id="glow" cx=".18" cy=".1" r=".8">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".34"/>
      <stop offset=".6" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e3e6ff"/>
    </linearGradient>
    <linearGradient id="flap" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f4f5ff"/>
      <stop offset="1" stop-color="#cfd3ff"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffdc8a"/>
      <stop offset="1" stop-color="#ff9a3d"/>
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#1a0f6b" flood-opacity=".38"/>
    </filter>
    <clipPath id="env"><rect x="22" y="36" width="72" height="52" rx="11"/></clipPath>
  </defs>
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#bg)"/>
  <rect x="6" y="6" width="116" height="116" rx="30" fill="url(#glow)"/>
  <rect x="6.75" y="6.75" width="114.5" height="114.5" rx="29.25" fill="none" stroke="#ffffff" stroke-opacity=".2" stroke-width="1.5"/>
  <!-- envelope -->
  <g filter="url(#soft)">
    <rect x="22" y="36" width="72" height="52" rx="11" fill="url(#paper)"/>
    <g clip-path="url(#env)">
      <path d="M18 34 H98 L64 64 a9 9 0 0 1 -12 0 Z" fill="url(#flap)"/>
      <path d="M22 40 L52.5 65.5 a8.5 8.5 0 0 0 11 0 L94 40" fill="none" stroke="#5a55e6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </g>
  <!-- clock badge -->
  <circle cx="92" cy="88" r="25" fill="#3a2bb8"/>
  <circle cx="92" cy="88" r="20" fill="url(#sun)"/>
  <circle cx="92" cy="88" r="19.25" fill="none" stroke="#ffffff" stroke-opacity=".45" stroke-width="1.5"/>
  <path d="M92 76.5 V88 L99.5 93" fill="none" stroke="#33259f" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
